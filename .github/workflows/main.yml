name: Morocco Tech Radar
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9:00 AM Rabat time
  workflow_dispatch: 

permissions:
  contents: write # Crucial for saving the history file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests
      - name: Run Scan
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Commit changes
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "MaTechRadarBot"
          git add history.json
          git commit -m "Update history" || echo "No new events to save"
          git push || echo "No changes to push"
